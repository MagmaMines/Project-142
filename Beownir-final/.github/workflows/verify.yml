name: verify

# The repository is the deliverable and the checked-in HTML is the artifact, so
# CI proves three things on every push: the single file is internally consistent
# (sync + static checks), the measured Node compatibility has not regressed, and
# the whole test suite passes against the runtime embedded in that file.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the single file, the compatibility floor and the test suite
        run: npm run verify
      - name: Compare the runtime with the running Node
        run: npm run differential
      - name: Verify static deployment server and headers
        run: |
          node tools/deploy-files.mjs
          node tools/serve-static.mjs 8099 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:8099/ && break; sleep 0.5; done
          curl -fsSI http://127.0.0.1:8099/ | grep -qi "cross-origin-opener-policy: same-origin"
          curl -fsSI http://127.0.0.1:8099/ | grep -qi "cross-origin-embedder-policy: require-corp"
          curl -fsSI http://127.0.0.1:8099/coi-sw.js | grep -qi "service-worker-allowed: /"
          npm run standalone:smoke
