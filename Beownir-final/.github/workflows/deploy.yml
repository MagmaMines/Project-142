name: deploy

# Verifies the release, deploys the verified bytes to Netlify, then checks the
# live site from the outside. The two secrets are optional: without them the
# deploy step is skipped and the workflow still proves the artifact is shippable.
#
#   NETLIFY_AUTH_TOKEN  personal access token (Netlify: User settings -> Applications)
#   NETLIFY_SITE_ID     site API id (Netlify: Site configuration -> Site information)
#
# Both live in Settings -> Secrets and variables -> Actions. Nothing secret is
# checked in, and the deploy only runs from `main`.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the single file, the compatibility floor and the test suite
        run: npm run verify
      - name: Compare the runtime with the running Node
        run: npm run differential
      - name: Verify static deployment server and headers
        run: |
          node tools/serve-static.mjs 8099 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:8099/ && break; sleep 0.5; done
          curl -fsSI http://127.0.0.1:8099/ | grep -qi "cross-origin-opener-policy: same-origin"
          curl -fsSI http://127.0.0.1:8099/ | grep -qi "cross-origin-embedder-policy: require-corp"
          curl -fsSI http://127.0.0.1:8099/coi-sw.js | grep -qi "service-worker-allowed: /"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Explain why the deploy is skipped
        if: env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == ''
        run: |
          echo "::notice::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID are not set: the deploy step is skipped."
          echo "The artifact is verified and shippable; add the two secrets to publish from CI."
      - name: Deploy the publish directory
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: |
          # --dir sends exactly o/site: the verified artifact, coi-sw.js and the
          # generated _headers. No build on Netlify's side, so what is deployed is
          # byte-for-byte what the verify job checked.
          npx --yes netlify-cli@17 deploy --prod --dir o/site --message "CI ${GITHUB_SHA::7}"
      - name: Check the live site
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: |
          URL=$(npx --yes netlify-cli@17 status --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(j.ssl_url||j.url||'')}catch{console.log('')}})")
          echo "Deployed to $URL"
          curl -fsSI "$URL" | grep -qi "cross-origin-opener-policy: same-origin"
          curl -fsSI "$URL" | grep -qi "cross-origin-embedder-policy: require-corp"
          curl -fsSI "${URL%/}/coi-sw.js" | grep -qi "service-worker-allowed: /"
